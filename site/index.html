<html lang="zh-Hant">
<head>

</head>
<body>
  <main>
    <header><div><p class="eyebrow">TAIWAN 150 SCANNER</p><h1>小白投資策略掃描</h1><p>臺灣50＋臺灣中型100・120交易日完整性閘門</p></div><a id="run" class="button" href="#">手動掃描</a></header>
